name: Small pocket pair GTO EV experiment

on:
  push:
    branches:
      - experiment/gto-small-pocket-pair-ev-20261016
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paired-deal pocket pair experiment
        run: |
          set -o pipefail
          PYTHONPATH=. python -u experiments/low_pair_gto_selfplay.py --samples 1200 | tee low_pairs_ab.txt
      - name: Publish structured results
        uses: actions/upload-artifact@v4
        with:
          name: pocket-pair-gto-selfplay-HU-multiway
          path: low_pairs_ab.txt
