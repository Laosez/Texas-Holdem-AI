      - test_gto_postflop_50.py
      - test_gto505_rounding.py
      - test_gto51_seniority.py
      - test_gto52_seniority_shadow.py
      - test_gto53_weighted_seniority.py
      - test_gto531_tie_band.py
      - test_gto54_step_range.py
      - test_gto541_optimization.py
      - test_independent_river_auditor.py
      - test_compact_poker_pages.py
      - independent_river_auditor.py
      - benchmark_gto541.py
      - bots/gto_postflop_541.py
      - gto5_shadow_detail.py
      - test_gto_trace_exact_audit.py
      - test_gto_postflop_21_variants.py
      - test_gto_postflop_31.py
      - test_gto_postflop_32.py
      - test_gto_postflop_33.py
      - test_gto_postflop_40.py
      - test_gto_postflop_30.py
      - gto_trace_exact_audit.py
      - bots/gto_postflop_30.py
      - bots/gto_postflop_32.py
      - bots/hand_seniority_51.py
      - docs/GTO_5_1_SENIORITY.md
      - bots/__init__.py
      - bots/gto_postflop_50.py
      - replit_simulator.py
      - export_preflop_ranges_v4.py
      - replit_ui/index.html
      - test_gto5_shadow_ui.js
      - strategy_catalog/available_bases.json
      - .github/workflows/gto5-shadow-calibration.yml
  push:
    paths:
      - gto5_shadow_report.py
      - test_gto5_shadow_report.py
      - test_gto_postflop_50.py
      - test_gto505_rounding.py
      - test_gto51_seniority.py
      - test_gto52_seniority_shadow.py
      - test_gto53_weighted_seniority.py
      - test_gto531_tie_band.py
      - test_gto54_step_range.py
      - test_gto541_optimization.py
      - test_independent_river_auditor.py
      - test_compact_poker_pages.py
      - independent_river_auditor.py
      - benchmark_gto541.py
      - bots/gto_postflop_541.py
      - gto5_shadow_detail.py
      - test_gto_trace_exact_audit.py
      - test_gto_postflop_21_variants.py
      - test_gto_postflop_31.py
      - test_gto_postflop_32.py
      - test_gto_postflop_33.py
      - test_gto_postflop_40.py
      - test_gto_postflop_30.py
      - gto_trace_exact_audit.py
      - bots/gto_postflop_30.py
      - bots/gto_postflop_32.py
      - bots/hand_seniority_51.py
      - docs/GTO_5_1_SENIORITY.md
      - bots/__init__.py
      - bots/gto_postflop_50.py
      - replit_simulator.py
      - export_preflop_ranges_v4.py
      - replit_ui/index.html
      - test_gto5_shadow_ui.js
      - strategy_catalog/available_bases.json
      - .github/workflows/gto5-shadow-calibration.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run shadow report regression tests
        run: python -m unittest -v test_gto5_shadow_report test_gto_postflop_50 test_gto_postflop_30 test_gto505_rounding test_gto51_seniority test_gto52_seniority_shadow test_gto53_weighted_seniority test_gto531_tie_band test_gto54_step_range test_gto541_optimization test_independent_river_auditor test_compact_poker_pages test_gto_trace_exact_audit
      - name: Run identical full unittest suite as Railway Docker build
        env:
          THAI_ENGINE_IMPL: legacy
        run: python -m unittest test_replit_simulator test_screen1 test_street_split_bot test_a17_position_ranges test_reliability test_planner test_planner_http test_planner_ui_restore test_planner_ui_colors_ev test_planner_postflop_ev test_planner_hero_postflop_ui test_gto_postflop_20 test_gto_postflop_21 test_gto_postflop_21_variants test_gto_postflop_30 test_gto_postflop_31 test_gto_postflop_32 test_gto_postflop_33 test_gto_postflop_40 test_gto_postflop_50 test_gto505_rounding test_gto51_seniority test_gto52_seniority_shadow test_gto53_weighted_seniority test_gto531_tie_band test_gto54_step_range test_gto541_optimization test_independent_river_auditor test_compact_poker_pages test_gto_trace_exact_audit test_gto5_shadow_report test_storage_compaction test_ev_decomposition test_catalog_ev_report test_river_attribution test_board150_catalog test_plan_ev_workflow test_plan_parallel_mc test_plan_cache_retention test_postflop_telemetry test_analysis test_postflop_profiles test_tournament_rules_logic test_postflop_numeric_classifier test_flop_board_structure test_postflop_composite_classifier test_postflop_composite_catalog test_postflop_catalog_metrics test_postflop_catalog_goals -v
      - name: Benchmark GTO 5.4.1 speed without performance gate
        run: python -u benchmark_gto541.py
      - name: Verify independent river exporter and post-tournament report
        env:
          THAI_ENGINE_IMPL: legacy
          POKER_PREFLOP_PROTOCOL: any_two_limp
        run: |
          python export_preflop_ranges_v4.py \
            --players "P1=split:random:gto_postflop_541_step15,P2=split:random:random_2" \
            --tournaments 2 --parallel 1 --seed 981 --chips 200 \
            --sb 1 --bb 2 --blind-increase-every 20 --max-hands 150 \
            --shadow-percent 100 --shadow-reference independent_river \
            --out /tmp/independent_river_ci
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/independent_river_ci')
          report=json.loads((root/'independent_river_report.json').read_text())
          assert report['format']=='SKACHKOV_INDEPENDENT_RIVER_V1'
          assert report['mode']=='independent_river'
          assert report['sample_count'] > 0, 'Expected real HU river decisions in integration smoke'
          assert report['aggression']['n'] > 0, 'Expected real BET/RAISE observations in integration smoke'
          assert all('regret_bb' not in row for row in report['aggression']['by_bot_action'])
          aggression=(root/'independent_river_aggression.jsonl').read_text()
          assert aggression.strip() and 'villain_hole' not in aggression
          assert 'regret_bb' not in report['overall']
          raw=(root/'independent_river_samples.jsonl').read_text()
          assert 'villain_hole' not in raw and 'opponent_hole' not in raw
          legacy=json.loads((root/'gto5_shadow_report.json').read_text())
          assert legacy['requested_reference']=='independent_river'
          PY
      - name: Verify Shadow dashboard interaction and sorting
        run: node test_gto5_shadow_ui.js
      - name: Verify GTO 4.1 plays normally under independent-only Shadow
        env:
          THAI_ENGINE_IMPL: legacy
          POKER_PREFLOP_PROTOCOL: any_two_limp
        run: |
          python export_preflop_ranges_v4.py \
            --players "P1=split:random:gto_postflop_41_5,P2=split:random:random_2" \
            --tournaments 2 --parallel 1 --seed 987 --chips 200 \
            --sb 1 --bb 2 --blind-increase-every 20 --max-hands 150 \
            --shadow-percent 100 --out /tmp/independent_gto41_player
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root=Path('/tmp/independent_gto41_player')
          report=json.loads((root/'independent_river_report.json').read_text())
          assert report['format']=='SKACHKOV_INDEPENDENT_RIVER_V1', report
          assert report['sample_count'] > 0, report
          legacy=json.loads((root/'gto5_shadow_report.json').read_text())
          assert legacy['compared']==0, legacy
          assert legacy['requested_reference']=='independent_river'
          rejected=subprocess.run([sys.executable,'export_preflop_ranges_v4.py',
              '--shadow-reference','gto41'],capture_output=True,text=True)
          assert rejected.returncode != 0 and 'invalid choice' in rejected.stderr, rejected.stderr
          assert (root/'tournament_report.json').is_file()
          PY
