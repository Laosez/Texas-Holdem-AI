name: GTO 5.0 shadow report
on:
  pull_request:
    paths:
      - gto5_shadow_report.py
      - test_gto5_shadow_report.py
      - test_gto_postflop_50.py
      - test_gto505_rounding.py
      - test_gto51_seniority.py
      - test_gto52_seniority_shadow.py
      - test_gto53_weighted_seniority.py
      - test_gto531_tie_band.py
      - test_gto54_step_range.py
      - test_gto541_optimization.py
      - test_independent_river_auditor.py
      - independent_river_auditor.py
      - benchmark_gto541.py
      - bots/gto_postflop_541.py
      - gto5_shadow_detail.py
      - test_gto_trace_exact_audit.py
      - test_gto_postflop_30.py
      - gto_trace_exact_audit.py
      - bots/gto_postflop_30.py
      - bots/gto_postflop_32.py
      - bots/hand_seniority_51.py
      - docs/GTO_5_1_SENIORITY.md
      - bots/__init__.py
      - bots/gto_postflop_50.py
      - replit_simulator.py
      - export_preflop_ranges_v4.py
      - replit_ui/index.html
      - test_gto5_shadow_ui.js
      - strategy_catalog/available_bases.json
      - .github/workflows/gto5-shadow-calibration.yml
  push:
    paths:
      - gto5_shadow_report.py
      - test_gto5_shadow_report.py
      - test_gto_postflop_50.py
      - test_gto505_rounding.py
      - test_gto51_seniority.py
      - test_gto52_seniority_shadow.py
      - test_gto53_weighted_seniority.py
      - test_gto531_tie_band.py
      - test_gto54_step_range.py
      - test_gto541_optimization.py
      - test_independent_river_auditor.py
      - independent_river_auditor.py
      - benchmark_gto541.py
      - bots/gto_postflop_541.py
      - gto5_shadow_detail.py
      - test_gto_trace_exact_audit.py
      - test_gto_postflop_30.py
      - gto_trace_exact_audit.py
      - bots/gto_postflop_30.py
      - bots/gto_postflop_32.py
      - bots/hand_seniority_51.py
      - docs/GTO_5_1_SENIORITY.md
      - bots/__init__.py
      - bots/gto_postflop_50.py
      - replit_simulator.py
      - export_preflop_ranges_v4.py
      - replit_ui/index.html
      - test_gto5_shadow_ui.js
      - strategy_catalog/available_bases.json
      - .github/workflows/gto5-shadow-calibration.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run shadow report regression tests
        run: python -m unittest -v test_gto5_shadow_report test_gto_postflop_50 test_gto_postflop_30 test_gto505_rounding test_gto51_seniority test_gto52_seniority_shadow test_gto53_weighted_seniority test_gto531_tie_band test_gto54_step_range test_gto541_optimization test_independent_river_auditor test_gto_trace_exact_audit
      - name: Benchmark GTO 5.4.1 speed without performance gate
        run: python -u benchmark_gto541.py
      - name: Verify independent river exporter and post-tournament report
        env:
          THAI_ENGINE_IMPL: legacy
          POKER_PREFLOP_PROTOCOL: any_two_limp
        run: |
          python export_preflop_ranges_v4.py \
            --players "P1=split:random:gto_postflop_541_step15,P2=split:random:random_2" \
            --tournaments 2 --parallel 1 --seed 981 --chips 200 \
            --sb 1 --bb 2 --blind-increase-every 20 --max-hands 150 \
            --shadow-percent 100 --shadow-reference independent_river \
            --out /tmp/independent_river_ci
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/independent_river_ci')
          report=json.loads((root/'independent_river_report.json').read_text())
          assert report['format']=='SKACHKOV_INDEPENDENT_RIVER_V1'
          assert report['mode']=='independent_river'
          assert 'regret_bb' not in report['overall']
          raw=(root/'independent_river_samples.jsonl').read_text()
          assert 'villain_hole' not in raw and 'opponent_hole' not in raw
          legacy=json.loads((root/'gto5_shadow_report.json').read_text())
          assert legacy['requested_reference']=='independent_river'
          PY
      - name: Verify Shadow dashboard interaction and sorting
        run: node test_gto5_shadow_ui.js
      - name: Tournament Shadow 100% integration smoke
        env:
          THAI_ENGINE_IMPL: legacy
          POKER_PREFLOP_PROTOCOL: any_two_limp
        run: |
          python export_preflop_ranges_v4.py \
            --players "P1=split:random:gto_postflop_50_5,P2=split:random:random_2" \
            --tournaments 1 --parallel 1 --seed 487 --chips 200 \
            --sb 1 --bb 2 --blind-increase-every 20 --max-hands 100 \
            --shadow-percent 100 --out /tmp/gto5_e2e
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/gto5_e2e')
          report=json.loads((root/'gto5_shadow_report.json').read_text())
          assert report['compared']>0, report
          assert report['groups']['street'], report
          assert report['groups']['opponents'], report
          assert report['groups']['board_structure'], report
          assert (root/'tournament_report.json').is_file()
          print('Shadow paired decision audit:',report['compared'])
          PY

      - name: GTO 5.0.5 round5 Shadow 100% integration smoke
        env:
          THAI_ENGINE_IMPL: legacy
          POKER_PREFLOP_PROTOCOL: any_two_limp
        run: |
          python export_preflop_ranges_v4.py \
            --players "P1=split:random:gto_postflop_505_5,P2=split:random:random_2" \
            --tournaments 1 --parallel 1 --seed 488 --chips 200 \
            --sb 1 --bb 2 --blind-increase-every 20 --max-hands 100 \
            --shadow-percent 100 --shadow-reference gto50 --out /tmp/gto505_e2e
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/gto505_e2e')
          report=json.loads((root/'gto5_shadow_report.json').read_text())
          assert report['compared'] > 0, report
          assert report['requested_reference']=='gto50', report
          assert report['comparisons'][0]['label']=='GTO 5.0.5 → GTO 5.0', report
          assert report['groups']['street'], report
          events=[json.loads(line) for line in (root/'gto5_shadow_decisions.jsonl').read_text().splitlines() if line.strip()]
          assert events and all(row['actor']=='gto505' and row['reference_model']=='gto50' for row in events)
          assert (root/'tournament_report.json').is_file()
          print('Rounded v baseline Shadow paired decisions:',report['compared'])
          PY

      - name: GTO 5.1 and 5.1.5 Shadow rank-and-rounding A/B integration
        env:
          THAI_ENGINE_IMPL: legacy
          POKER_PREFLOP_PROTOCOL: any_two_limp
        run: |
          python export_preflop_ranges_v4.py \
            --players "P1=split:random:gto_postflop_515_5,P2=split:random:gto_postflop_51_5,P3=split:random:random_2" \
            --tournaments 1 --parallel 1 --seed 491 --chips 200 \
            --sb 1 --bb 2 --blind-increase-every 20 --max-hands 100 \
            --shadow-percent 100 --shadow-reference gto51 --out /tmp/gto51_e2e
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/gto51_e2e')
          report=json.loads((root/'gto5_shadow_report.json').read_text())
          assert report['compared']>0, report
          assert report['requested_reference']=='gto51', report
          assert all(r['reference_model']=='gto51' for r in
                 (json.loads(x) for x in (root/'gto5_shadow_decisions.jsonl').read_text().splitlines() if x.strip()))
          assert any(x['actor']=='gto515' for x in report['comparisons']), report
          assert (root/'tournament_report.json').is_file()
          print('GTO 5.1.5 → GTO 5.1 shadow comparisons:',report['compared'])
          PY
