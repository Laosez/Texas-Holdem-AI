name: Railway simulator smoke
on:
  push:
    branches:
      - feat/railway-simulator-20261014
      - feat/simulator-screen-1-20261014
      - feat/reliability-a17-20261014
      - feat/plan-multiway-editor-20261014
      - fix/planner-33-66-colors-box-bulk-20261015
      - fix/screen1-five-postflop-only-20261016
      - fix/plan-opponent-grid-a17-ev-sliders-20261016
      - feat/planner-postflop-ev-matrix-20261016
      - feat/gto-postflop-v2-pair-board-and-soft-blue-20261016
      - fix/planner-hero-gto-v2-visible-20261016
      - feat/gto-postflop-v3-kicker-draw-paired-board-20261016
      - feat/hand-ev-decomposition-loss-attribution-20261016
      - fix/fullwidth-decomposition-below-planner-workspace-20261016
      - feat/plan-ev-default-pot-error-autodecomp-20261016
      - fix/plan-simulation-controls-two-column-20261016
  pull_request:
    branches:
      - feat/railway-simulator-20261014
      - release/poker-system-v1-20261014
      - release/poker-system-v2-1-plan-20261015
  workflow_dispatch:

jobs:
  plan-chart-bb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Plan script syntax and chart lines
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('replit_ui/plan.html').read_text(encoding='utf-8')
          script=page.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/plan_bet_graph.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/plan_bet_graph.js
          node test_plan_equity_chart.js
      - name: BB vs SB and Plan editor unit tests
        run: |
          python -m py_compile planner_core.py
          python -m unittest test_planner test_planner_http test_plan_ev_workflow -v
  analysis-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Targeted analysis, session and C-bet tests
        run: |
          python -m py_compile export_preflop_ranges_v4.py replit_simulator.py
          python -m unittest test_postflop_telemetry test_analysis test_screen1 test_replit_simulator -v
      - name: JavaScript syntax of implementation and embedded analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'analysis.html'):
              html = (Path('replit_ui') / name).read_text(encoding='utf-8')
              code = html.split('<script>', 1)[1].split('</script>', 1)[0]
              Path('/tmp/analysis_' + name + '.js').write_text(code, encoding='utf-8')
          PY
          node --check /tmp/analysis_index.html.js
          node --check /tmp/analysis_analysis.html.js
      - name: Export two tournaments and verify telemetry invariants
        env:
          THAI_ENGINE_IMPL: legacy
        run: |
          python -u export_preflop_ranges_v4.py \
            --players a17_tag,gto --tournaments 2 --parallel 1 \
            --seed 2042 --chips 500 --sb 1 --bb 2 \
            --blind-increase-every 50 --max-hands 10000 \
            --seat-mode rotate --out output/analysis_metrics_smoke
          python - <<'PY'
          import csv
          from pathlib import Path
          folder=Path('output/analysis_metrics_smoke')
          for name in ('postflop_summary.csv',
                       'postflop_position_summary.csv',
                       'postflop_position_stage_summary.csv'):
              with (folder/name).open(newline='') as fh:
                  reader=csv.DictReader(fh)
                  for street in ('flop','turn','river'):
                      metric=street+'_fold_to_cbet'
                      assert metric in reader.fieldnames, (name,metric)
                      assert metric+'_n' in reader.fieldnames
                      assert metric+'_opp' in reader.fieldnames
                  for row in reader:
                      for street in ('flop','turn','river'):
                          for metric in (street+'_cbet', street+'_fold_to_cbet'):
                              n=float(row[metric+'_n'])
                              opp=float(row[metric+'_opp'])
                              assert 0 <= n <= opp, (name,metric,n,opp)
                              expected=100*n/opp if opp else None
                              reported=row[metric]
                              if expected is None: assert reported=='', (name,metric,reported)
                              else: assert abs(float(reported)-expected)<=0.00006, (name,metric,reported,expected)
          print('Telemetry numerators, opportunities and CSV percentages verified')
          PY

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: |
          python -m unittest test_replit_simulator test_screen1 test_a17_position_ranges test_reliability test_planner test_planner_http test_planner_ui_restore test_planner_ui_colors_ev test_planner_postflop_ev test_planner_hero_postflop_ui test_gto_postflop_v2 test_gto_postflop_v3 test_gto_postflop_v4 test_s100_scenarios test_s100_third_sheet test_postflop_numeric_classifier test_flop_board_structure test_postflop_composite_classifier test_postflop_composite_catalog test_postflop_catalog_metrics test_postflop_catalog_goals test_postflop_strategy_compare test_postflop_profiles test_plan_parallel_mc test_postflop_telemetry test_analysis test_tournament_rules_logic test_street_split_bot test_ev_decomposition test_catalog_ev_report test_river_attribution test_board150_catalog test_plan_ev_workflow -v
      - name: Verify Screen 1 JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("replit_ui/index.html").read_text(encoding="utf-8")
          code = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/poker_replay_screen1.js").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/poker_replay_screen1.js
      - name: Verify Screen 2 JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("replit_ui/plan.html").read_text(encoding="utf-8")
          code = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/poker_plan_ui.js").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/poker_plan_ui.js
      - name: Catalogue sort behavioral tests
        run: node test_catalog_sort_logic.js
      - name: Preflop strategy cache behavioral tests
        run: node test_preflop_strategy_cache.js
      - name: Verify S100 JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("replit_ui/s100.html").read_text(encoding="utf-8")
          code = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/poker_s100_ui.js").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/poker_s100_ui.js
      - name: Board150 BDR financial views behavioral tests
        run: node test_board150_bdr_ui.js
      - name: Verify new Postflop Board150 JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("replit_ui/river_board.html").read_text(encoding="utf-8")
          code = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/poker_board150_ui.js").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/poker_board150_ui.js
      - name: Verify Screen 4 Analysis JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("replit_ui/analysis.html").read_text(encoding="utf-8")
          code = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/poker_analysis_ui.js").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/poker_analysis_ui.js
      - name: Two-tournament smoke
        env:
          THAI_ENGINE_IMPL: legacy
        run: |
          python -u export_preflop_ranges_v4.py \
            --players a17_tag,gto \
            --tournaments 2 --parallel 1 --seed 2042 \
            --chips 500 --sb 1 --bb 2 \
            --blind-increase-every 50 --max-hands 10000 \
            --seat-mode rotate --out output/railway_smoke
          test -f output/railway_smoke/tournament_report.json
          test -f output/railway_smoke/summary_position_n2.csv
          test -f output/railway_smoke/postflop_position_stage_summary.csv
          test -f output/railway_smoke/by_hand_position_169_all.csv
      - name: PC GTO BTN smoke
        env:
          THAI_ENGINE_IMPL: legacy
        run: |
          python -u export_preflop_ranges_v4.py \
            --players "P1=split:pc_gto_80bb:tag_punisher,P2=split:gto:tag_punisher" \
            --tournaments 2 --parallel 1 --seed 42 \
            --chips 500 --sb 1 --bb 2 \
            --blind-increase-every 50 --max-hands 10000 \
            --seat-mode rotate --out output/pc_gto_btn_smoke
          test -f output/pc_gto_btn_smoke/tournament_report.json

      - name: Full 169-hand multiway equity smoke
        run: |
          python - <<'PY'
          import time
          from planner_equity import calculate_matrix
          rows = [
              {"profile":"builtin:any_two","position":p,"scenario":"rfi","players":9,"selector":"active"}
              for p in ("9","4","BB","SB","3")
          ]
          started=time.perf_counter()
          result=calculate_matrix(rows,model="selected",trials=50)
          assert len(result["equity"])==169
          assert all(0<=v<=100 for v in result["equity"].values())
          print(f"169 hands x 5 opponents x 50 runouts: {time.perf_counter()-started:.2f}s")
          PY
